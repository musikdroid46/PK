name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip semua file zip
        run: |
          for z in *.zip; do
            [ -f "$z" ] && unzip -q -o "$z"
          done

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Build debug APK
        run: |
          FILE=$(find . -name settings.gradle.kts | head -n1)
          if [ -z "$FILE" ]; then echo "Proyek tidak ditemukan"; ls -R | head -40; exit 1; fi
          cd "$(dirname "$FILE")"
          gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: PromptKomik-apk
          path: "**/build/outputs/apk/debug/*.apk"
